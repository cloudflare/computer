name: Install
description: Set up Node and install dependencies with npm's package cache.

inputs:
  registry-url:
    description: Registry URL for setup-node (set this when publishing).
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v6
      with:
        node-version: 24
        registry-url: ${{ inputs.registry-url }}
        cache: npm

    # npm ci compiles computerd's vendored FUSE addon against these.
    - name: Install the libfuse 3 headers
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libfuse3-dev

    - name: Install dependencies
      shell: bash
      run: npm ci
