name: Rust
description: Set up Rust with both musl targets, capnp, and a build cache for packages/remote-exec.

runs:
  using: composite
  steps:
    # build.rs compiles remote-exec's protocol schema with capnp.
    - name: Install capnp
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends capnproto

    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
        components: rustfmt, clippy

    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: packages/remote-exec
