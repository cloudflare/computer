# Per-package + per-example check matrix. One job per workspace so a
# regression in (say) computerd's tests doesn't hide a typecheck failure in
# workspace. Each job is self-contained: install at the repo root,
# build siblings whose dist/ this package's typecheck depends on,
# then run oxlint + oxfmt + typecheck + tests scoped to that package.
#
# Runs on every PR and on pushes to the long-lived branches. The release
# workflow also dispatches CI for the release branch because its GITHUB_TOKEN
# push cannot start another workflow.
#
# remote-exec, the Rust binary behind @cloudflare/computer/remote-exec, has
# jobs of its own: `remote-exec` lints it and builds the release binaries
# once, and the jobs after it test, run and package those same builds.
#
# Path filters skip pure documentation changes — they have no influence on
# any package's lint, typecheck, or test surface.

name: CI

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/**/*.md"
  push:
    branches: [main, next, release]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/**/*.md"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  # PRs key on the PR number so successive pushes cancel the prior run. The
  # version branch also keeps only its newest run, while main builds remain a
  # historical signal and are never canceled.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/release' }}

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: dofs
            workspace: "@cloudflare/dofs"
            path: packages/dofs
            needs-siblings: false
            extra-test: "test:workers"
          - name: rpc
            workspace: "@cloudflare/computer-rpc"
            path: packages/rpc
            needs-siblings: true
          - name: computer
            workspace: "@cloudflare/computer"
            path: packages/computer
            needs-siblings: true
            build-computerd-bin: true
            extra-test: "test:harness"
            system-deps: "fuse3 xz-utils"
          - name: computerd
            workspace: "@cloudflare/computerd"
            path: packages/computerd
            needs-siblings: true
            build-computerd-bin: true
            # fuse3 provides fusermount3 for the real-FUSE tests; xz-utils
            # unpacks the Node binary build:bin injects into.
            system-deps: "fuse3 xz-utils"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: ./.github/actions/install

      - name: Install system dependencies
        if: matrix.system-deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ matrix.system-deps }}

      - name: Prepare Docker and FUSE
        if: matrix.build-computerd-bin
        run: |
          docker info
          sudo modprobe fuse
          sudo chmod a+rw /dev/fuse

      # Build every npm workspace's dist/ unconditionally for now. The
      # computer + computerd jobs need dofs + rpc dist, the rpc job needs
      # dofs dist, and the cost of an extra `tsc` pass is small
      # compared to the test runtime. Revisit per-package once
      # @cloudflare/computer bundles dofs + rpc internally.
      - name: Build all workspaces
        if: matrix.needs-siblings
        run: npm run build --workspaces --if-present

      - name: Build this package
        if: matrix.needs-siblings == false
        run: npm run build --workspace ${{ matrix.workspace }} --if-present

      # The computer harness and computerd's real-FUSE regression both
      # discover the standalone binary at artifacts/computerd/. Building it
      # makes those suites execute instead of silently skipping.
      - name: Build computerd binary
        if: matrix.build-computerd-bin
        run: npm run build:bin --workspace @cloudflare/computerd

      - name: Lint
        run: npx oxlint --format=github ${{ matrix.path }}

      - name: Format check
        run: npx oxfmt --check ${{ matrix.path }}

      - name: Typecheck
        run: npm run typecheck --workspace ${{ matrix.workspace }} --if-present

      - name: Test
        run: npm test --workspace ${{ matrix.workspace }} --if-present

      - name: Test (${{ matrix.extra-test }})
        if: matrix.extra-test
        run: npm run ${{ matrix.extra-test }} --workspace ${{ matrix.workspace }}

  example:
    name: example/${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: artifacts
            workspace: "@example/computer-artifacts"
            path: examples/artifacts
          - name: assets
            workspace: "@example/computer-assets"
            path: examples/assets
          - name: codemode
            workspace: "@example/computer-codemode"
            path: examples/codemode
          - name: container
            workspace: "@example/computer-container"
            path: examples/container
          - name: container-legacy
            workspace: "@example/computer-container-legacy"
            path: examples/container-legacy
          - name: mcp
            workspace: "@example/computer-mcp"
            path: examples/mcp
          - name: remote-exec
            workspace: "@example/computer-remote-exec"
            path: examples/remote-exec
          - name: pi-ai
            workspace: "@example/computer-pi-ai"
            path: examples/pi-ai
          - name: tanstack-ai
            workspace: "@example/computer-tanstack-ai"
            path: examples/tanstack-ai
          - name: think
            workspace: "@cloudflare/example-think"
            path: examples/think
          - name: think-compare-runtimes
            workspace: "@cloudflare/example-think-compare-runtimes"
            path: examples/think-compare-runtimes
          - name: tutorial
            workspace: "@example/computer-tutorial"
            path: examples/tutorial
          - name: worker-shell
            workspace: "@example/computer-worker-shell"
            path: examples/worker-shell
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: ./.github/actions/install

      # Examples consume the monorepo packages via local symlinks, so
      # @cloudflare/computer's dist/ has to exist before the example's
      # typecheck resolves its imports.
      - run: npm run build --workspaces --if-present

      # worker-configuration.d.ts is generated, not committed. The
      # repo-root postinstall hook writes it for every example during
      # install; this step is the explicit guard so the typecheck below
      # still sees real bindings if that hook is ever skipped.
      - name: Generate worker types
        run: npm run build:types --workspace ${{ matrix.workspace }}

      - name: Lint
        run: npx oxlint --format=github ${{ matrix.path }}

      - name: Format check
        run: npx oxfmt --check ${{ matrix.path }}

      - name: Typecheck
        run: npm run typecheck --workspace ${{ matrix.workspace }} --if-present

      # Most examples don't ship tests today; --if-present keeps this a
      # no-op for them while running suites such as think-compare-runtimes.
      - name: Test
        run: npm test --workspace ${{ matrix.workspace }} --if-present

  # Lints remote-exec, checks the TypeScript generated from its protocol
  # schema, and builds both release binaries. Every later remote-exec job
  # uses this artifact.
  remote-exec:
    name: remote-exec
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: ./.github/actions/install
      - uses: ./.github/actions/rust

      - name: Lint
        run: npm run lint:rust --workspace @cloudflare/remote-exec

      - name: Generated code is up to date
        run: |
          npm run gen:capnp --workspace @cloudflare/computer
          git diff --exit-code -- packages/computer/src/remote-exec/capnp

      - name: Build the release binaries
        run: npm run build:bin --workspace @cloudflare/remote-exec

      - uses: actions/upload-artifact@v4
        with:
          name: remote-exec
          path: artifacts/remote-exec/
          if-no-files-found: error

  # cargo test, and @cloudflare/computer's Node suites against the release
  # binary, on both architectures. As root: some cases switch user, chown,
  # and read other users' environments.
  remote-exec-test:
    name: remote-exec (${{ matrix.arch }})
    needs: remote-exec
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: ./.github/actions/install
      - uses: ./.github/actions/rust

      - name: Test the binary
        working-directory: packages/remote-exec
        run: |
          cargo test --locked --no-run
          sudo -E env "PATH=$PATH" "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" \
            "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" cargo test --locked
          # Hand the target directory back for the cache.
          sudo chown -R "$(id -u):$(id -g)" target

      - uses: actions/download-artifact@v4
        with:
          name: remote-exec
          path: artifacts/remote-exec/

      - name: Test the module against the release binary
        env:
          REMOTE_EXEC_BIN: ${{ github.workspace }}/artifacts/remote-exec/remote-exec-linux-${{ matrix.arch }}
        run: |
          chmod 755 artifacts/remote-exec/*
          sudo -E env "PATH=$PATH" npm run test:remote-exec --workspace @cloudflare/computer

  # examples/remote-exec in `wrangler dev`, with a real container, through
  # its vitest suites.
  remote-exec-e2e:
    name: example/remote-exec (e2e)
    needs: remote-exec
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: ./.github/actions/install

      # The example's scripts/fetch-remote-exec.sh takes the builds from
      # here rather than from a release.
      - uses: actions/download-artifact@v4
        with:
          name: remote-exec
          path: artifacts/remote-exec/

      - run: npm run build --workspaces --if-present

      - name: Test
        run: npm run test:e2e --workspace @example/computer-remote-exec

  # The cloudflare/computer-remote-exec image, for both platforms, from the
  # same binaries.
  remote-exec-image:
    name: remote-exec image
    needs: remote-exec
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/download-artifact@v4
        with:
          name: remote-exec
          path: artifacts/remote-exec/

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build and run it
        run: |
          for platform in linux/amd64 linux/arm64; do
            docker buildx build --platform "$platform" --load --tag remote-exec:test \
              --file packages/remote-exec/Dockerfile artifacts/remote-exec
            docker run --rm --platform "$platform" remote-exec:test | tee version.txt
            grep -q " protocol " version.txt
          done

  preview:
    name: preview package
    if: >-
      ${{
        (github.event_name == 'pull_request' && github.head_ref != 'release') ||
        github.ref == 'refs/heads/release'
      }}
    needs: [package, example]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: tree:0

      - uses: ./.github/actions/install

      - run: npm run build --workspaces --if-present

      - run: npx pkg-pr-new publish --peerDeps ./packages/computer
