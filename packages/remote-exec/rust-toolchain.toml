# The one Rust version remote-exec builds with, here, in CI, in releases and in dev/run.sh's image
# (.github/actions/rust and dev/run.sh read `channel`). Pinned, not `stable`: the release image and
# the binaries on the GitHub release must be the same bytes, which a rebuild only reproduces with
# the same toolchain. Change it in its own commit.
[toolchain]
channel = "1.99.1"
targets = ["x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl"]
components = ["rustfmt", "clippy"]
profile = "minimal"
